<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#08090b">
  <title>Divirta-se</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090b;color:#f5f5f5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100dvh;touch-action:manipulation;background:#08090b}
    .shell{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 6px max(6px,env(safe-area-inset-bottom))}
    .intro{text-align:center;line-height:1.14;flex:0 0 auto;user-select:none}
    .intro strong{display:block;font-size:clamp(18px,5vw,24px);font-weight:800;letter-spacing:.015em}
    .intro span{display:block;margin-top:4px;font-size:clamp(10px,3vw,12px);opacity:.68}
    .intro small{display:block;margin-top:3px;font-size:clamp(9px,2.7vw,11px);opacity:.43}
    .frame-slot{flex:0 0 auto;width:var(--sw,512px);height:var(--sh,448px)}
    .screen{position:relative;width:512px;height:448px;overflow:hidden;background:#000;border:2px solid #181a1f;border-radius:4px;zoom:var(--fit,1)}
    iframe{position:absolute;left:-208.5px;top:0;width:980px;height:640px;border:0;margin:0;background:#000;display:block}
    @media (orientation:landscape){.shell{gap:2px;padding:2px}.intro strong{font-size:12px}.intro span{font-size:9px;margin-top:1px}.intro small{display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="intro">
      <strong>Encoste. Jogue. Divirta-se.</strong>
      <span>Aguarde alguns instantes para o jogo carregar.</span>
      <small>Vire o celular para jogar melhor.</small>
    </header>
    <div class="frame-slot">
      <section class="screen">
        <iframe
          src="https://www.retrogames.cz/play_895-SNES.php?emulator=EJS&Ads=No#game"
          title="Mega Man X2"
          scrolling="no"
          fetchpriority="high"
          allowfullscreen webkitallowfullscreen mozallowfullscreen
          sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-presentation"
          allow="autoplay; fullscreen; gamepad">
        </iframe>
      </section>
    </div>
  </main>
  <script>
    function fit(){
      var landscape=innerWidth>innerHeight;
      var reserve=landscape?28:88;
      var s=Math.min(1,(innerWidth-10)/512,(innerHeight-reserve)/448);
      if(s<.25)s=.25;
      var st=document.documentElement.style;
      st.setProperty('--fit',String(s));
      st.setProperty('--sw',(512*s)+'px');
      st.setProperty('--sh',(448*s)+'px');
    }
    fit();
    addEventListener('resize',fit,{passive:true});
    addEventListener('orientationchange',fit,{passive:true});
  </script>
</body>
</html>
