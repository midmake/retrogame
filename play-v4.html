<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#090a0c">
  <title>Divirta-se</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090a0c;color:#f5f5f5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100dvh;touch-action:manipulation}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px),radial-gradient(circle at 50% 20%,#24272c 0,transparent 48%)}
    .shell{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:max(12px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}
    .intro{position:relative;z-index:2;text-align:center;line-height:1.15;flex:0 0 auto;user-select:none}
    .intro strong{display:block;font-size:clamp(18px,5vw,24px);font-weight:800;letter-spacing:.015em}
    .intro span{display:block;margin-top:5px;font-size:clamp(10px,3vw,12px);opacity:.68}
    .intro small{display:block;margin-top:4px;font-size:clamp(9px,2.7vw,11px);opacity:.44}
    .slot{position:relative;width:var(--slot-w,512px);height:var(--slot-h,448px);flex:0 0 auto}
    .tv{position:absolute;left:0;top:0;width:512px;height:448px;transform-origin:0 0;transform:scale(var(--fit,1));background:#000;border:4px solid #17191e;border-radius:8px;overflow:hidden;contain:strict}
    .crop{position:absolute;inset:0;overflow:hidden;background:#000}
    iframe{position:absolute;left:-208.5px;top:0;width:980px;height:448px;border:0;margin:0;background:#000;display:block}
    @media (orientation:landscape){.shell{gap:2px;padding:2px}.intro strong{font-size:12px}.intro span{font-size:9px;margin-top:1px}.intro small{display:none}.tv{border-width:2px;border-radius:4px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="intro">
      <strong>Encoste. Jogue. Divirta-se.</strong>
      <span>Aguarde alguns instantes para o jogo carregar.</span>
      <small>Vire o celular para jogar melhor. Se o áudio não iniciar, toque uma vez no jogo.</small>
    </header>
    <div class="slot">
      <section class="tv">
        <div class="crop">
          <iframe
            src="https://www.retrogames.cz/play_895-SNES.php?emulator=EJS&Ads=No#game"
            title="Mega Man X2"
            scrolling="no"
            fetchpriority="high"
            allowfullscreen webkitallowfullscreen mozallowfullscreen
            sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-presentation"
            allow="autoplay; fullscreen; gamepad">
          </iframe>
        </div>
      </section>
    </div>
  </main>
  <script>
    let raf=0;
    function fit(){
      cancelAnimationFrame(raf);
      raf=requestAnimationFrame(function(){
        var landscape=innerWidth>innerHeight;
        var reserve=landscape?28:92;
        var s=Math.min(1,(innerWidth-12)/512,(innerHeight-reserve)/448);
        s=Math.max(.25,s);
        var root=document.documentElement.style;
        root.setProperty('--fit',String(s));
        root.setProperty('--slot-w',(512*s)+'px');
        root.setProperty('--slot-h',(448*s)+'px');
      });
    }
    fit();
    addEventListener('resize',fit,{passive:true});
    addEventListener('orientationchange',fit,{passive:true});
  </script>
</body>
</html>
