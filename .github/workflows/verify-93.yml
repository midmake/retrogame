name: Verify 93 games individually

on:
  push:
    paths:
      - '.github/workflows/verify-93.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify title, ID and EmulatorJS page one by one
        run: |
          git show 82a2939733f378e6e9b38f42ffa1bc28337b84bf:snes-catalog.json > /tmp/catalog.json
          cat > /tmp/verify.py <<'PY'
          import json,re,subprocess,unicodedata,time
          from pathlib import Path

          expected = [
          "Chrono Trigger","Super Metroid","Final Fantasy III","Mega Man X","Donkey Kong Country 2: Diddy's Kong Quest",
          "EarthBound","Donkey Kong Country","Final Fantasy II","Lufia II: Rise of the Sinistrals","Kirby Super Star",
          "Tetris Attack","Mega Man X2","Super Street Fighter II: The New Challengers","Secret of Mana",
          "Teenage Mutant Ninja Turtles IV: Turtles in Time","Super Castlevania IV","Contra III: The Alien Wars",
          "Donkey Kong Country 3: Dixie Kong's Double Trouble!","Mega Man X3","Wild Guns","Breath of Fire II",
          "Street Fighter II Turbo: Hyper Fighting","Demon's Crest","Ogre Battle: The March of the Black Queen",
          "International Superstar Soccer Deluxe","Illusion of Gaia","Super Punch-Out!!","The Ninja Warriors","Sunset Riders",
          "ActRaiser","NBA Jam Tournament Edition","Shadowrun","Ultimate Mortal Kombat 3","U.N. Squadron",
          "Street Fighter Alpha 2","Kirby's Dream Land 3","Uncharted Waters: New Horizons","Soul Blazer",
          "Rock N' Roll Racing","Secret of Evermore","R-Type III: The Third Lightning","Harvest Moon","The Lost Vikings",
          "Super Turrican 2","Street Fighter II: The World Warrior","Cybernator","Lost Vikings II","Zombies Ate My Neighbors",
          "Tecmo Super Bowl","Top Gear","Top Gear 3000","Space Megaforce","Pocky & Rocky 2","Mortal Kombat II",
          "Final Fight 3","Star Fox","Pocky & Rocky","F-Zero","Ken Griffey Jr.'s Winning Run","Gradius III",
          "Mega Man 7","Super Bomberman 2","Biker Mice from Mars","Hagane: The Final Conflict","NBA Jam","SimCity",
          "International Superstar Soccer","Killer Instinct","The Legend of the Mystical Ninja","The Adventures of Batman & Robin",
          "Sparkster","Robotrek","The King of Dragons","E.V.O.: Search for Eden","Breath of Fire","Saturday Night Slam Masters",
          "Axelay","Top Gear 2","Metal Warriors","Ken Griffey Jr. Presents Major League Baseball","Flashback: The Quest for Identity",
          "The Magical Quest Starring Mickey Mouse","Earthworm Jim 2","Super Bomberman","Uniracers","Super Ghouls 'N Ghosts",
          "Mortal Kombat 3","Bust-A-Move","Super Turrican","Aladdin","Ninja Gaiden Trilogy","Maui Mallard in Cold Shadow","Aero Fighters"
          ]

          aliases = {
            "Final Fantasy III":"Final Fantasy VI",
            "Final Fantasy II":"Final Fantasy IV",
            "Donkey Kong Country 2: Diddy's Kong Quest":"Donkey Kong Country 2: Diddy’s Kong Quest",
            "Donkey Kong Country 3: Dixie Kong's Double Trouble!":"Donkey Kong Country 3: Dixie Kong’s Double Trouble!",
            "Demon's Crest":"Demon’s Crest",
            "The Adventures of Batman & Robin":"Adventures of Batman & Robin, The",
            "The Legend of the Mystical Ninja":"Legend of the Mystical Ninja, The",
            "The Magical Quest Starring Mickey Mouse":"Magical Quest Starring Mickey Mouse, The",
            "Lost Vikings II":"Lost Vikings II: Norse by Norsewest",
            "Gradius III":"Gradius III - The Outbreak",
            "Super Ghouls 'N Ghosts":"Super Ghouls ’N Ghosts"
          }

          def norm(s):
              s=unicodedata.normalize('NFKD',s).encode('ascii','ignore').decode().lower()
              s=s.replace('&',' and ')
              s=re.sub(r'\bthe\b',' ',s)
              s=re.sub(r'\bjr\b',' ',s)
              s=re.sub(r'[^a-z0-9]+',' ',s)
              return ' '.join(s.split())

          catalog=json.load(open('/tmp/catalog.json'))
          by_norm={norm(x['title']):x for x in catalog}
          verified=[]; unavailable=[]; mismatch=[]

          for idx,title in enumerate(expected,1):
              wanted=aliases.get(title,title)
              item=by_norm.get(norm(wanted))
              if not item:
                  unavailable.append((idx,title,'NOT_IN_RETROGAMES_CZ_SNES_CATALOG'))
                  print(f'[{idx:02}/93] NO CATALOG: {title}',flush=True)
                  continue
              gid=item['id']; catalog_title=item['title']
              url=f'https://www.retrogames.cz/play_{gid}-SNES.php?emulator=EJS&Ads=No'
              try:
                  p=subprocess.run(['curl','-L','--fail','--max-time','25','--retry','1','-sS',url],capture_output=True,text=True,timeout=60)
                  body=p.stdout
              except Exception as e:
                  unavailable.append((idx,title,'FETCH_ERROR'))
                  print(f'[{idx:02}/93] FETCH ERROR: {title} id={gid}',flush=True)
                  continue
              mname=re.search(r'EJS_gameName\s*=\s*["\']([^"\']+)',body)
              mrom=re.search(r'EJS_gameUrl\s*=\s*["\']([^"\']+)',body)
              mplayer=re.search(r'EJS_player\s*=\s*["\']#game["\']',body)
              if not (mname and mrom and mplayer):
                  unavailable.append((idx,title,'NO_WORKING_EJS'))
                  print(f'[{idx:02}/93] NO EJS: {title} id={gid}',flush=True)
                  continue
              page_name=mname.group(1).strip()
              if norm(page_name)!=norm(catalog_title):
                  mismatch.append((idx,title,gid,catalog_title,page_name))
                  print(f'[{idx:02}/93] NAME MISMATCH: expected={title} catalog={catalog_title} page={page_name}',flush=True)
                  continue
              verified.append((idx,title,gid,catalog_title,mrom.group(1)))
              print(f'[{idx:02}/93] OK: {title} -> {gid} -> {page_name}',flush=True)
              time.sleep(.08)

          with open('verified-93.tsv','w') as f:
              f.write('N\tREQUESTED_TITLE\tID\tRETROGAMES_TITLE\tROM_PATH\tOUR_LINK\n')
              for n,t,g,c,r in verified:
                  f.write(f'{n}\t{t}\t{g}\t{c}\t{r}\thttps://midmake.github.io/retrogame/?game={g}\n')
          with open('unavailable-93.tsv','w') as f:
              f.write('N\tREQUESTED_TITLE\tREASON\n')
              for row in unavailable: f.write('\t'.join(map(str,row))+'\n')
          with open('mismatch-93.tsv','w') as f:
              f.write('N\tREQUESTED_TITLE\tID\tCATALOG_TITLE\tPAGE_TITLE\n')
              for row in mismatch: f.write('\t'.join(map(str,row))+'\n')
          Path('verify-summary.txt').write_text(f'EXPECTED=93\nVERIFIED={len(verified)}\nUNAVAILABLE={len(unavailable)}\nMISMATCH={len(mismatch)}\n')
          PY
          python /tmp/verify.py
      - name: Commit temporary verification output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verified-93.tsv unavailable-93.tsv mismatch-93.tsv verify-summary.txt
          git commit -m 'temporary verified 93 game mapping' || exit 0
          git push
