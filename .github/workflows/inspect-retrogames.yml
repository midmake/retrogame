name: Inspect RetroGames EJS

on:
  push:
    paths:
      - '.github/workflows/inspect-retrogames.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect loader
        run: |
          curl -L --fail --silent --show-error 'https://www.retrogames.cz/EJS/loader.js' -o loader-retrogames.js
          {
            echo '=== LOADER ==='
            cat loader-retrogames.js
            echo
            echo '=== OLD CORES / VERSION / DATA REFERENCES ==='
            grep -Ein 'oldCores|version|data|retroarch|core|threads|wasm' loader-retrogames.js || true
          } > loader-check.txt
      - name: Commit inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loader-retrogames.js loader-check.txt
          git commit -m 'inspect retrogames EJS loader' || exit 0
          git push
