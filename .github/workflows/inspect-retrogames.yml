name: Extract SNES Catalog

on:
  push:
    paths:
      - '.github/workflows/inspect-retrogames.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and parse RetroGames catalog
        run: |
          set -euxo pipefail
          curl -L --fail --silent --show-error 'https://www.retrogames.cz/direct_links.php' -o direct-links.html
          python - <<'PY'
          import re, json, html
          text=open('direct-links.html',encoding='utf-8',errors='ignore').read()
          rows=[]
          # Capture visible title immediately before each SNES play link.
          for m in re.finditer(r'>([^<>]{1,140}?)\s*</[^>]+>\s*(?:</[^>]+>\s*)*<a[^>]+href=["\'](?:https?://www\.retrogames\.cz/)?play_(\d+)-SNES\.php["\']', text, re.I|re.S):
              title=re.sub(r'\s+',' ',html.unescape(m.group(1))).strip(' \t\r\n|-')
              if title:
                  rows.append({'id':int(m.group(2)),'title':title})
          # fallback: table-row oriented parser
          if len(rows)<50:
              rows=[]
              for tr in re.findall(r'<tr\b.*?</tr>',text,re.I|re.S):
                  mm=re.search(r'href=["\'](?:https?://www\.retrogames\.cz/)?play_(\d+)-SNES\.php["\']',tr,re.I)
                  if not mm: continue
                  plain=re.sub(r'<[^>]+>',' ',tr)
                  plain=re.sub(r'\s+',' ',html.unescape(plain)).strip()
                  plain=re.sub(r'^\d+\s*','',plain)
                  title=plain.split('http')[0].strip(' |')
                  rows.append({'id':int(mm.group(1)),'title':title})
          dedup={r['id']:r for r in rows}
          out=[dedup[k] for k in sorted(dedup)]
          open('snes-catalog.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print('SNES entries:',len(out))
          PY
      - name: Commit catalog temporarily
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snes-catalog.json
          git commit -m 'temporary SNES catalog extraction' || exit 0
          git push
