name: Inspect RetroGames EJS

on:
  push:
    paths:
      - '.github/workflows/inspect-retrogames.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch source and headers
        run: |
          curl -L --fail --silent --show-error \
            -A 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Version/17.0 Mobile/15E148 Safari/604.1' \
            'https://www.retrogames.cz/play_895-SNES.php?emulator=EJS&Ads=No' \
            -o inspection-source.html

          {
            echo '=== LOADER HEADERS ==='
            curl -L -sS -D - -o /dev/null -H 'Origin: https://midmake.github.io' 'https://www.retrogames.cz/EJS/loader.js'
            echo
            echo '=== ROM HEADERS ==='
            curl -L -sS -D - -o /dev/null -H 'Origin: https://midmake.github.io' 'https://www.retrogames.cz/SNES/Mega_Man_X2.zip'
          } > cors-check.txt
      - name: Extract emulator clues
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('inspection-source.html').read_text('utf-8', errors='ignore')
          out = []
          out.append(f'SOURCE_BYTES={len(text.encode())}')
          out.append('\n=== IFRAME SRC ===')
          for m in re.finditer(r'<iframe[^>]*?src=["\']([^"\']+)', text, re.I|re.S):
              out.append(m.group(1))
          out.append('\n=== SCRIPT SRC ===')
          for m in re.finditer(r'<script[^>]*?src=["\']([^"\']+)', text, re.I|re.S):
              out.append(m.group(1))
          out.append('\n=== EJS CONFIG ===')
          for i,line in enumerate(text.splitlines(),1):
              if re.search(r'EJS_|EJS/loader', line, re.I):
                  out.append(f'{i}: {line.strip()}')
          Path('inspection-summary.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
      - name: Commit inspection files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspection-source.html inspection-summary.txt cors-check.txt
          git commit -m 'inspect retrogames emulator source' || exit 0
          git push
