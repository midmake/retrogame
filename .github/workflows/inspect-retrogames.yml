name: Inspect RetroGames EJS

on:
  push:
    paths:
      - '.github/workflows/inspect-retrogames.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect page EJS configuration
        run: |
          curl -L --fail --silent --show-error \
            'https://www.retrogames.cz/play_895-SNES.php?emulator=EJS&Ads=No' \
            -o page-ejs.html
          {
            echo '=== EJS CONFIG LINES ==='
            grep -Ein -C 4 'EJS_|loader.js|Mega_Man_X2|oldCores|Settings|VirtualGamepad|startOn' page-ejs.html || true
          } > ejs-page-config.txt
      - name: Commit inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add page-ejs.html ejs-page-config.txt
          git commit -m 'inspect RetroGames EJS page config' || exit 0
          git push
