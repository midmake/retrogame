name: Inspect RetroGames EJS

on:
  push:
    paths:
      - '.github/workflows/inspect-retrogames.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Measure player in installed Chrome
        run: |
          set -euxo pipefail
          which google-chrome || which google-chrome-stable || which chromium || which chromium-browser
          npm init -y
          npm install puppeteer-core@24.16.0
          cat > measure.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import { writeFileSync } from 'node:fs';
          import { execSync } from 'node:child_process';
          const candidates=['google-chrome','google-chrome-stable','chromium','chromium-browser'];
          let exe='';
          for (const c of candidates) { try { exe=execSync(`which ${c}`).toString().trim(); if(exe) break; } catch{} }
          if(!exe) throw new Error('Chrome not found');
          const browser=await puppeteer.launch({headless:true,executablePath:exe,args:['--no-sandbox']});
          const page=await browser.newPage();
          await page.setViewport({width:980,height:1000,deviceScaleFactor:1,isMobile:true,hasTouch:true});
          await page.setUserAgent('Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Version/17.0 Mobile/15E148 Safari/604.1');
          const errors=[];
          page.on('console',m=>{if(m.type()==='error') errors.push('console: '+m.text())});
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));
          await page.goto('https://www.retrogames.cz/play_895-SNES.php?emulator=EJS&Ads=No',{waitUntil:'domcontentloaded',timeout:90000});
          await page.waitForSelector('#game',{timeout:90000});
          await new Promise(r=>setTimeout(r,5000));
          const data=await page.evaluate(()=>{
            const g=document.querySelector('#game');
            const r=g.getBoundingClientRect();
            const p=g.parentElement.getBoundingClientRect();
            return {
              game:{x:r.x,y:r.y,width:r.width,height:r.height},
              parent:{x:p.x,y:p.y,width:p.width,height:p.height},
              scrollWidth:document.documentElement.scrollWidth,
              scrollHeight:document.documentElement.scrollHeight,
              innerWidth:window.innerWidth,
              innerHeight:window.innerHeight,
              bodyMargin:getComputedStyle(document.body).margin,
              children:g.children.length,
              html:g.outerHTML.slice(0,2000)
            };
          });
          writeFileSync('layout-check.txt',JSON.stringify({...data,errors},null,2));
          await browser.close();
          JS
          node measure.mjs
      - name: Commit measurement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add layout-check.txt
          git commit -m 'measure retrogames player layout' || exit 0
          git push
