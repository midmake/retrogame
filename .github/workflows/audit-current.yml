name: Audit current RetroGames routes

on:
  push:
    paths:
      - '.github/workflows/audit-current.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GitHub Pages to publish current wrapper
        run: |
          set -e
          for i in $(seq 1 18); do
            html=$(curl -L -sS --max-time 20 'https://midmake.github.io/retrogame/' || true)
            if printf '%s' "$html" | grep -q 'const LEGACY'; then
              printf '%s' "$html" > /tmp/live-index.html
              echo 'Current wrapper is live.'
              exit 0
            fi
            sleep 10
          done
          echo 'Current wrapper did not appear on Pages in time.' >&2
          exit 1
      - name: Verify all 52 published wrapper routes
        run: |
          npm init -y >/dev/null 2>&1
          npm install jsdom@26 >/dev/null 2>&1
          cat > /tmp/check.js <<'JS'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          const html=fs.readFileSync('/tmp/live-index.html','utf8');
          const ids=[800,900,865,785,882,289,1000,1614,802,1632,895,919,947,793,639,798,1021,933,1133,1008,994,857,1152,1743,1142,1266,1539,1669,1542,773,903,910,825,830,815,1452,904,1365,875,1320,887,861,1410,1538,1211,1157,1037,1579,1059,879,1509,1504];
          let ok=0,fail=[];
          for(const id of ids){
            const dom=new JSDOM(html,{url:`https://midmake.github.io/retrogame/?game=${id}`,runScripts:'dangerously'});
            const frame=dom.window.document.getElementById('gameFrame');
            const unavailable=dom.window.document.querySelector('.unavailable');
            const expected=`https://www.retrogames.cz/play_${id}-SNES.php?emulator=EJS&Ads=No`;
            if(frame && !unavailable && frame.src===expected) ok++;
            else fail.push({id,frame:frame&&frame.src,unavailable:!!unavailable});
            dom.window.close();
          }
          fs.writeFileSync('wrapper-audit.json',JSON.stringify({total:ids.length,working:ok,failed:fail},null,2));
          fs.writeFileSync('wrapper-summary.txt',`TOTAL=${ids.length}\nWORKING=${ok}\nFAILED=${fail.length}\n`);
          if(fail.length){ console.error(fail); process.exit(1); }
          JS
          node /tmp/check.js
      - name: Recheck RetroGames source routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures, requests, re
          from pathlib import Path
          ids=[800,900,865,785,882,289,1000,1614,802,1632,895,919,947,793,639,798,1021,933,1133,1008,994,857,1152,1743,1142,1266,1539,1669,1542,773,903,910,825,830,815,1452,904,1365,875,1320,887,861,1410,1538,1211,1157,1037,1579,1059,879,1509,1504]
          def test(i):
              u=f'https://www.retrogames.cz/play_{i}-SNES.php?emulator=EJS&Ads=No'
              try:
                  t=requests.get(u,timeout=25,headers={'User-Agent':'Mozilla/5.0'}).text
                  gm=re.search(r'EJS_gameName\s*=\s*["\']([^"\']+)',t)
                  gu=re.search(r'EJS_gameUrl\s*=\s*["\']([^"\']+)',t)
                  gp=re.search(r'EJS_player\s*=\s*["\']#game["\']',t)
                  return i, bool(gm and gu and gp), gm.group(1).strip() if gm else '', gu.group(1).strip() if gu else ''
              except Exception as e:return i,False,'',repr(e)
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex: rows=list(ex.map(test,ids))
          good=[x for x in rows if x[1]]; bad=[x for x in rows if not x[1]]
          with open('source-working.tsv','w') as f:
              f.write('ID\tGAME_NAME\tGAME_URL\n')
              for i,_,n,u in good:f.write(f'{i}\t{n}\t{u}\n')
          Path('source-summary.txt').write_text(f'TOTAL={len(ids)}\nWORKING={len(good)}\nFAILED={len(bad)}\n')
          if bad: print('FAILED',bad); raise SystemExit(1)
          PY
      - name: Commit temporary final audit
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wrapper-audit.json wrapper-summary.txt source-working.tsv source-summary.txt 2>/dev/null || true
          git commit -m 'temporary final published wrapper audit' || exit 0
          git push
