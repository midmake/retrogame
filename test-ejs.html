<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Divirta-se</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
    body{min-height:100dvh;touch-action:manipulation}

    /* O player real da RetroGames mede 512 x 448. Esta janela mostra somente ele. */
    .stage{
      position:fixed;
      left:50%;
      top:50%;
      width:512px;
      height:448px;
      overflow:hidden;
      background:#000;
      transform-origin:center center;
      transform:translate(-50%,-50%) scale(var(--fit,1));
    }

    /* Medição real da página em viewport de 980px:
       #game = x 208.5 / y 231 / 512 x 448. */
    iframe{
      position:absolute;
      left:-208.5px;
      top:-231px;
      width:980px;
      height:1000px;
      border:0;
      margin:0;
      background:#000;
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <iframe
      src="https://www.retrogames.cz/play_895-SNES.php?emulator=EJS&Ads=No"
      title="Mega Man X2"
      scrolling="no"
      allowfullscreen
      webkitallowfullscreen
      mozallowfullscreen
      sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-presentation"
      allow="autoplay; fullscreen; gamepad">
    </iframe>
  </main>

  <script>
    function fitPlayer(){
      const safeW = Math.max(1, window.innerWidth - 4);
      const safeH = Math.max(1, window.innerHeight - 4);
      const scale = Math.min(safeW / 512, safeH / 448);
      document.documentElement.style.setProperty('--fit', String(scale));
    }
    fitPlayer();
    addEventListener('resize', fitPlayer, {passive:true});
    addEventListener('orientationchange', fitPlayer, {passive:true});
  </script>
</body>
</html>
