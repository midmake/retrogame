<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07090d" />
  <title>Teste EmulatorJS</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#07090d;color:#f4f4f4;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
    body{min-height:100dvh}
    .player{position:fixed;inset:0;background:#000;overflow:hidden}
    iframe{display:block;width:100%;height:100%;border:0;background:#000}
    .label{position:fixed;top:max(10px,env(safe-area-inset-top));left:0;right:0;z-index:3;text-align:center;pointer-events:none;font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.55;text-shadow:0 2px 10px #000}
  </style>
</head>
<body>
  <div class="label">Teste EmulatorJS • sem anúncios</div>
  <main class="player">
    <iframe
      src="https://www.retrogames.cz/play_895-SNES.php?emulator=EJS&Ads=No"
      title="Mega Man X2 - EmulatorJS"
      allowfullscreen
      webkitallowfullscreen
      mozallowfullscreen
      scrolling="no"
      allow="autoplay; fullscreen; gamepad">
    </iframe>
  </main>
</body>
</html>
