<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07090d" />
  <title>Teste EmulatorJS</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#07090d;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
    body{min-height:100dvh}
    .viewport{position:fixed;inset:0;background:#000;overflow:hidden}
    iframe{position:absolute;width:1100px;height:1800px;border:0;background:#000;transform-origin:0 0}
    .hud{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:20;display:grid;gap:7px;justify-items:center;pointer-events:none}
    .status{padding:5px 9px;border-radius:999px;background:rgba(0,0,0,.72);font-size:10px;letter-spacing:.08em;pointer-events:none}
    .controls{display:grid;grid-template-columns:repeat(5,44px);gap:6px;pointer-events:auto}
    button{width:44px;height:44px;border:1px solid rgba(255,255,255,.2);border-radius:12px;background:rgba(15,15,18,.9);color:#fff;font-size:18px;font-weight:700;-webkit-tap-highlight-color:transparent}
    .wide{grid-column:span 2;width:94px;font-size:11px}
    .label{position:fixed;top:max(8px,env(safe-area-inset-top));left:0;right:0;z-index:10;text-align:center;pointer-events:none;font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.6;text-shadow:0 2px 10px #000}
    .hidden .hud,.hidden .label{display:none}
  </style>
</head>
<body>
  <div class="label">Calibrar recorte • EmulatorJS sem anúncios</div>
  <main class="viewport">
    <iframe id="frame"
      src="https://www.retrogames.cz/play_895-SNES.php?emulator=EJS&Ads=No"
      title="Mega Man X2 - EmulatorJS"
      allowfullscreen webkitallowfullscreen mozallowfullscreen
      scrolling="no"
      allow="autoplay; fullscreen; gamepad">
    </iframe>
  </main>

  <div class="hud">
    <div class="status" id="status"></div>
    <div class="controls">
      <button data-dx="-80">←</button>
      <button data-dy="-80">↑</button>
      <button data-dy="80">↓</button>
      <button data-dx="80">→</button>
      <button id="zoomIn">+</button>
      <button id="zoomOut">−</button>
      <button id="reset">↺</button>
      <button id="hide" class="wide">OCULTAR</button>
    </div>
  </div>

  <script>
    const frame=document.getElementById('frame');
    const status=document.getElementById('status');
    let x=-330,y=-430,s=.72;
    const apply=()=>{
      frame.style.transform=`translate(${x}px,${y}px) scale(${s})`;
      status.textContent=`X ${x} • Y ${y} • ZOOM ${s.toFixed(2)}`;
    };
    document.querySelectorAll('[data-dx]').forEach(b=>b.onclick=()=>{x+=Number(b.dataset.dx);apply()});
    document.querySelectorAll('[data-dy]').forEach(b=>b.onclick=()=>{y+=Number(b.dataset.dy);apply()});
    document.getElementById('zoomIn').onclick=()=>{s=Math.min(1.3,s+.08);apply()};
    document.getElementById('zoomOut').onclick=()=>{s=Math.max(.35,s-.08);apply()};
    document.getElementById('reset').onclick=()=>{x=-330;y=-430;s=.72;apply()};
    document.getElementById('hide').onclick=()=>document.body.classList.add('hidden');
    apply();
  </script>
</body>
</html>
