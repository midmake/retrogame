<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07090d" />
  <title>Divirta-se</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:#07090d;color:#f4f4f4;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100dvh;display:grid;place-items:center;padding:max(14px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));overflow-x:hidden}
    .pixels{position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:22px 22px;mask-image:radial-gradient(circle at center,#000 5%,transparent 78%)}
    .wrap{position:relative;width:min(100%,980px);text-align:center}
    .eyebrow{margin:0 0 5px;font-size:10px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;opacity:.48}
    h1{margin:0 0 16px;font-size:clamp(22px,5vw,34px);font-weight:750;letter-spacing:-.02em}
    .player{position:relative;width:100%;aspect-ratio:4/3;background:#000;border:1px solid rgba(255,255,255,.12);border-radius:14px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.52)}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
    .loading{position:absolute;inset:0;display:grid;place-items:center;padding:24px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.48);background:#000;z-index:2;transition:opacity .25s ease}
    .loading.hide{opacity:0;pointer-events:none}
    .hint{margin:12px 0 0;font-size:11px;opacity:.38}
    @media (orientation:landscape) and (max-height:620px){body{padding:8px}.eyebrow,h1,.hint{display:none}.wrap{width:min(100%,calc(100dvh * 1.3333));}.player{max-height:calc(100dvh - 16px)}}
  </style>
</head>
<body>
  <div class="pixels"></div>
  <main class="wrap">
    <p class="eyebrow">encoste e jogue</p>
    <h1>Divirta-se.</h1>
    <section class="player">
      <div class="loading" id="loading">Carregando jogo…</div>
      <iframe id="game" title="Jogo" allowfullscreen webkitallowfullscreen mozallowfullscreen scrolling="no" allow="cross-origin-isolated; autoplay; fullscreen"></iframe>
    </section>
    <p class="hint">Use tela cheia para uma experiência melhor.</p>
  </main>
  <script>
    (()=>{
      const FALLBACK='19996-megaman-x2-usa';
      const q=new URLSearchParams(location.search);
      let game=(q.get('game')||FALLBACK).trim().toLowerCase();
      if(!/^[a-z0-9-]+$/.test(game)) game=FALLBACK;
      const frame=document.getElementById('game');
      const loading=document.getElementById('loading');
      frame.addEventListener('load',()=>loading.classList.add('hide'));
      frame.src='https://www.retrogames.cc/embed/'+game+'.html';
    })();
  </script>
</body>
</html>
