<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07090d" />
  <title>Divirta-se</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#07090d;color:#f4f4f4;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
    body{min-height:100dvh}
    .pixels{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.12;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:22px 22px}
    .player{position:fixed;inset:0;z-index:1;background:#000;overflow:hidden}
    iframe{display:block;width:100%;height:100%;border:0;background:#000}
    .brand{position:fixed;top:max(12px,env(safe-area-inset-top));left:0;right:0;z-index:3;text-align:center;pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.9)}
    .eyebrow{margin:0 0 3px;font-size:9px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;opacity:.48}
    h1{margin:0;font-size:clamp(18px,4.5vw,28px);font-weight:750;letter-spacing:-.02em}
    .loading{position:fixed;inset:0;z-index:4;display:grid;place-items:center;padding:24px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.48);background:#000;transition:opacity .25s ease;pointer-events:none}
    .loading.hide{opacity:0}
    @media (orientation:landscape){.brand{display:none}}
  </style>
</head>
<body>
  <div class="pixels"></div>
  <div class="brand">
    <p class="eyebrow">encoste e jogue</p>
    <h1>Divirta-se.</h1>
  </div>
  <main class="player">
    <iframe
      id="game"
      title="Jogo"
      allowfullscreen
      webkitallowfullscreen
      mozallowfullscreen
      scrolling="no"
      allow="autoplay; fullscreen; gamepad">
    </iframe>
  </main>
  <div class="loading" id="loading">Carregando jogo…</div>
  <script>
    (()=>{
      const FALLBACK='19996-megaman-x2-usa';
      const q=new URLSearchParams(location.search);
      let game=(q.get('game')||FALLBACK).trim().toLowerCase();
      if(!/^[a-z0-9-]+$/.test(game)) game=FALLBACK;
      const frame=document.getElementById('game');
      const loading=document.getElementById('loading');
      frame.addEventListener('load',()=>loading.classList.add('hide'));
      frame.src='https://www.retrogames.cc/embed/'+game+'.html';
    })();
  </script>
</body>
</html>
