<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090b10" />
  <title>Divirta-se</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090b10;color:#f5f5f5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh;display:grid;place-items:center;padding:18px 12px}.wrap{width:min(100%,960px);text-align:center}.eyebrow{margin:0 0 6px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;opacity:.5}.title{margin:0 0 18px;font-size:clamp(22px,5vw,34px)}.player{width:100%;aspect-ratio:4/3;display:grid;place-items:center;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:#000;box-shadow:0 22px 70px rgba(0,0,0,.45);overflow:hidden}.placeholder{padding:24px;opacity:.6;font-size:14px;line-height:1.5}.hint{margin:14px 0 0;font-size:12px;opacity:.45}.pixels{position:fixed;inset:0;pointer-events:none;opacity:.14;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:24px 24px;mask-image:radial-gradient(circle at center,#000 10%,transparent 75%)}
  </style>
</head>
<body>
  <div class="pixels"></div>
  <main class="wrap">
    <p class="eyebrow">encoste e jogue</p>
    <h1 class="title">Divirta-se.</h1>
    <section class="player">
      <div class="placeholder">Player pronto para receber um embed autorizado.</div>
    </section>
    <p class="hint">Experiência minimalista para celular e desktop.</p>
  </main>
</body>
</html>
